[tox]
envlist = pre-commit,towncrier-check,docs,py{311,312,313,313,314,315,316}
skip_missing_interpreters = true
isolated_build = True

[testenv:pre-commit]
package = wheel
wheel_build_env = .pkg
dependency_groups = pre-commit
commands = prek run --all-files --show-diff-on-failure --color=always

[testenv:towncrier{,-check}]
dependency_groups = towncrier
commands =
    check  : python -m towncrier.check --compare-with origin/main
    !check : python -m towncrier {posargs}

[testenv:py{,311,312,313,314,315,316}]
dependency_groups = test
commands =
    python -m coverage run -m pytest -vv
    python -m coverage report

[testenv:docs{,-lint,-live,-all}]
base_python = py314
dependency_groups = docs
commands =
    lint: pyspelling
    live: python -m zensical serve --open --config-file ./docs/zensical.toml --dev-addr localhost:8103 {posargs}
    !lint-!live: python -m zensical build --strict --clean --config-file ./docs/zensical.toml {posargs}
