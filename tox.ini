[tox]
envlist = pre-commit,towncrier-check,docs,py{311,312,313,313,314,315}
skip_missing_interpreters = true
isolated_build = True

[testenv:pre-commit]
package = wheel
wheel_build_env = .pkg
dependency_groups = pre-commit
commands = prek run --all-files --show-diff-on-failure --color=always

[testenv:towncrier{,-check}]
dependency_groups = towncrier
commands =
    check  : python -m towncrier.check --compare-with origin/main
    !check : python -m towncrier {posargs}

[testenv:py{,311,312,313,314,315}]
dependency_groups = test
commands =
    python -m coverage run -m pytest -vv
    python -m coverage report

[testenv:docs]
base_python = py312
build_dir = _build
change_dir = docs
dependency_groups = docs
commands =
    python -m sphinx build --fail-on-warning --keep-going --jobs auto -n --verbose --fresh-env --show-traceback --write-all -d _build/doctrees --builder html . {posargs:_build/html}
